[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "suprime"
version = "0.1.0"
description = "A powerful experimental swarm network — decentralised, gossip-based, self-organising."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SUPRIME contributors" }]
keywords = ["swarm", "gossip", "distributed-systems", "crdt", "p2p", "asyncio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-asyncio>=0.21", "hypothesis>=6.0"]
crypto = ["cryptography>=41.0"]

[project.scripts]
suprime = "suprime.cli:main"

[tool.setuptools.packages.find]
include = ["suprime*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
